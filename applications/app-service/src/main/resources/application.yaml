server:
  port: 8081
spring:
  application:
    name: "msc-solicitudes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  swagger-ui:
    path: "/api/doc/swagger-ui.html"
  api-docs:
    path: "/api/doc/api-docs"

routes:
  paths:
    loan: "/api/v1/solicitud"


adapters:
  users:
    baseUrl: "http://localhost:8080" #http://autenticacion:8080
    timeoutMs: "3000"
    userByIdentification: "/api/v1/users/{identification}"
    userByEmail: "/api/v1/user/{email}"
    validateToken: "/api/v1/auth"

  r2dbc:
    host: "localhost" #postgres17_db
    port: 5432
    database: "msc_solicitudes"
    schema: "public"
    username: "admin"
    password: "adminpassword"

jwt:
  secret: dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWZvci1kZXZlbG9wbWVudC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudA==

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"